filter {
  #calculate throughput if duration and both usage counters are available
  #(start/ongoing fireflies have no usage block; calling the script for them only logs warnings)
  if [duration] and [usage][received] and [usage][sent] {
    ruby {
      path => "/usr/lib/firefly/ruby/calc_throughput.rb"
      tag_on_exception => '_rubyexception in calc_throughput.rb'
    }
  }

  if [flow-lifecycle][throughput] {
    mutate {
      rename => { "[flow-lifecycle][throughput]" => "[throughput]" }
      rename => { "[flow-lifecycle][total_bytes]" => "[total_bytes]" }
    }
  }
}
