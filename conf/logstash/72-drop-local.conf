filter {
  # Drop local traffic where source and destination sites are the same
  # This uses the CRIC site name that was enriched in 70-cric-sites.conf,
  # so this file must sort after it
  if [meta][cric][src][name] and [meta][cric][dst][name] {
    if [meta][cric][src][name] == [meta][cric][dst][name] {
      drop { }
    }
  }
}
